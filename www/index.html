<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Abisum Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="app-version" content="1.1">
<meta name="app-build-date" content="13 Nov 2026">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header over one centred column. Shop is a product grid, checkout is form plus summary, owner area is status-led lists. */
:root{
  --bg:#F2F6F3; --surface:#FFFFFF; --fg:#16241E; --muted:#58695F; --line:#D9E3DD;
  --accent:#1E5C44; --accent-fg:#FFFFFF; --accent-soft:#E1EFE7;
  --note-bg:#FFF2D2; --note-fg:#5A4200; --note-line:#EBD28A;
  --good:#1F7A4D; --good-bg:#DDF1E5; --warn:#8A5A00; --warn-bg:#FCEBC6;
  --bad:#B3261E; --bad-bg:#FBE1DE; --info:#2A5C9E; --info-bg:#E0EBF8;
  --font-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:10px;
  --shadow:0 1px 2px rgba(10,30,20,.06),0 8px 24px rgba(10,30,20,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1714; --surface:#17241E; --fg:#E8F0EC; --muted:#9DB0A6; --line:#27382F;
    --accent:#5FC49A; --accent-fg:#08150F; --accent-soft:#1B3328;
    --note-bg:#2A2410; --note-fg:#F2D88A; --note-line:#4A3E16;
    --good:#7FD6A8; --good-bg:#16382A; --warn:#F0C766; --warn-bg:#3A2D0E;
    --bad:#F2A29B; --bad-bg:#3E1D1A; --info:#9CC3F2; --info-bg:#172B44;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#17241E; --fg:#E8F0EC; --muted:#9DB0A6; --line:#27382F;
  --accent:#5FC49A; --accent-fg:#08150F; --accent-soft:#1B3328;
  --note-bg:#2A2410; --note-fg:#F2D88A; --note-line:#4A3E16;
  --good:#7FD6A8; --good-bg:#16382A; --warn:#F0C766; --warn-bg:#3A2D0E;
  --bad:#F2A29B; --bad-bg:#3E1D1A; --info:#9CC3F2; --info-bg:#172B44;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  background:var(--bg); color:var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
a{color:var(--accent)}
.page{max-width:1080px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.demo-note{margin-top:12px;background:var(--note-bg);color:var(--note-fg);border:1px solid var(--note-line);border-radius:var(--radius);padding:8px 12px;font-size:13px}
.demo-note strong{font-weight:600}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.logo{order:0;font-family:var(--font-display);font-weight:700;font-size:25px;letter-spacing:.01em;color:var(--fg);text-decoration:none}
.cartbtn{order:2;margin-left:auto;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);text-decoration:none;font-weight:600}
.cartbtn[aria-current="page"]{border-color:var(--accent)}
.cartbtn .count{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.nav{order:3;flex-basis:100%;display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:6px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
@media (min-width:720px){
  .nav{order:1;flex-basis:auto}
  .cartbtn{order:2}
}

main{padding-top:20px;min-height:60vh}
.hero{padding:16px 0 22px}
.hero h1{font-size:clamp(28px,5.5vw,46px);font-weight:700;max-width:18ch;margin-bottom:10px}
.hero p{color:var(--muted);max-width:52ch}
.chips{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:500}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card img,.pdp-img img,.thumb img{display:block;width:100%;aspect-ratio:1;object-fit:cover;max-width:100%}
.cbody{display:flex;flex-direction:column;gap:6px;padding:12px;flex:1;min-width:0}
.cbody h3{font-size:17px;font-weight:600}
.cbody h3 a{color:var(--fg);text-decoration:none}
.cdesc{color:var(--muted);font-size:13px}
.cfoot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.price.big{font-size:26px;font-family:var(--font-display)}
.soldout{font-size:13px;font-weight:600;color:var(--muted);padding:6px 10px;border:1px dashed var(--line);border-radius:8px}

.btn{font:inherit;font-weight:600;border:1px solid transparent;border-radius:var(--radius);padding:10px 18px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-quiet{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.btn-block{width:100%}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.stp{font:inherit;font-size:18px;width:36px;height:36px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.stp:hover{background:var(--accent-soft)}
.qty{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

.back{display:inline-block;margin-bottom:14px;text-decoration:none;font-weight:500}
.pdp{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:720px){.pdp{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}}
.pdp-img{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.pdp-info{display:flex;flex-direction:column;gap:14px}
.pdp-info h1{font-size:clamp(26px,4vw,38px)}
.buyrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.ptitle{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.ptitle h1{font-size:clamp(24px,4vw,34px)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:820px){.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel h2{font-size:19px;margin-bottom:12px}
.line{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line:first-child{padding-top:0}
.thumb{width:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.lname{font-weight:600}
.lctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.linkbtn{font:inherit;background:none;border:0;padding:8px 4px;min-height:36px;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-variant-numeric:tabular-nums}
.row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:700;font-size:18px}
.empty{padding:40px 16px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);display:flex;flex-direction:column;gap:12px;align-items:center}

.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.span2{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input[readonly]{background:var(--bg)}
.field.err input,.field.err select{border-color:var(--bad)}
.msg-err{color:var(--bad);font-size:13px}
.payopts{display:grid;gap:10px;margin:0;padding:0;border:0;min-width:0}
.payopts legend{font-family:var(--font-display);font-weight:600;font-size:19px;padding:0;margin-bottom:10px}
.pay-opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:var(--surface);cursor:pointer}
.pay-opt input{width:auto;min-height:0;margin-top:3px;accent-color:var(--accent)}
.pay-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pay-opt strong{display:block}
.form-stack{display:flex;flex-direction:column;gap:22px}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-placed{background:var(--info-bg);color:var(--info)}
.s-packed{background:var(--warn-bg);color:var(--warn)}
.s-shipped{background:var(--accent-soft);color:var(--accent)}
.s-delivered{background:var(--good-bg);color:var(--good)}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border:1px dashed var(--line);border-radius:999px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding-bottom:20px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--accent)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.tl li.done .dot{background:var(--accent);border-color:var(--accent)}
.tl li.done .dot::after{content:"";width:6px;height:10px;border:solid var(--accent-fg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tl .when{color:var(--muted);font-size:13px}
.tl li.todo .what{color:var(--muted)}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button,.fchip{font:inherit;font-weight:600;padding:8px 14px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.tabs button[aria-pressed="true"],.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.olist{display:grid;gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:6px}
.ohead,.ofoot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.oid{font-variant-numeric:tabular-nums;font-size:16px}
details summary{cursor:pointer;font-weight:500;color:var(--muted);font-size:13px}
details p{margin-top:6px;font-size:13px}
.pedit{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
@media (max-width:520px){.pedit{grid-template-columns:minmax(0,1fr)}.pedit .pthumb{max-width:140px}}
.pthumb{display:flex;flex-direction:column;gap:8px}
.pthumb .thumbbig{border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.pthumb img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.filebtn{position:relative;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pfields{display:grid;gap:12px;min-width:0}
.pfoot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.chk{display:inline-flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.chk input{width:auto;min-height:0;accent-color:var(--accent)}
.stack{display:grid;gap:12px}
.sect{margin-top:28px}
.sect h2{font-size:20px;margin-bottom:10px}

.email{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0 0;overflow-wrap:anywhere}
.big-id{font-family:var(--font-display);font-size:clamp(28px,6vw,40px);font-weight:700;font-variant-numeric:tabular-nums}
.okmark{width:44px;height:44px;border-radius:50%;background:var(--good-bg);color:var(--good);display:flex;align-items:center;justify-content:center}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(5,15,10,.55);display:flex;align-items:flex-end;justify-content:center;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:grid;gap:14px;max-height:100%;overflow-y:auto}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-size:20px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.amount{font-family:var(--font-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.center{text-align:center;justify-items:center}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(92vw,440px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div class="page">
  <div class="demo-note" role="note"><strong>Demo version.</strong> Payments, shipping and emails are simulated, and the product pictures are placeholders.</div>
  <header class="top">
    <a class="logo" href="#shop">Abisum</a>
    <nav class="nav" aria-label="Main">
      <a href="#shop" data-nav="shop">Shop</a>
      <a href="#track" data-nav="track">Track order</a>
      <a href="#owner" data-nav="owner">Owner area</a>
    </nav>
    <a class="cartbtn" href="#cart" data-nav="cart" aria-label="Cart">Cart <span class="count" id="cart-count">0</span></a>
  </header>
  <main id="main"></main>
  <footer>Abisum is a working name for this demo. Delivery is a flat ₹30 per order.<br><span id="build-label"></span></footer>
</div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

  perfume: tile('#E3EBE4', sh(332,92)+

  var cust = {name:'Sample Customer', phone:'9000000001', email:'sample@example.com', a1:'12 Sample Street, Indiranagar', a2:'', city:'Bengaluru', state:'Karnataka', pin:'560038'};

  return {

      {id:'AB-1002', sample:true, customer:cust, items:o2items, subtotal:sum(o2items), delivery:DELIVERY_FEE, total:sum(o2items)+DELIVERY_FEE, method:'Card', status:'placed', log:{placed:now-3*H}, awb:null},

    ]

var storageOk = true;
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && o.d && Array.isArray(o.d.products) && Array.isArray(o.d.orders)){ D = o.d; cart = o.cart || {}; return; }
    }
  }catch(e){}
  D = seedData(); cart = {};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({d:D, cart:cart})); storageOk = true; }catch(e){ storageOk = false; }
  return storageOk;
}

/* ---------- helpers ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function inr(n){ return '₹' + Number(n).toLocaleString('en-IN'); }
function fmtTime(ts){ try{ return new Date(ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
function prod(id){ return D.products.filter(function(p){ return p.id === id; })[0]; }
function blankForm(){ return {name:'',phone:'',email:'',a1:'',a2:'',city:'',state:'',pin:''}; }

var S = {tab:'orders', filter:'all', payMethod:'upi', form:blankForm(), errors:{}, lastOrderId:null, trackQ:'', armReset:false, armRm:null};

function cartLines(){
  var changed = false;
  Object.keys(cart).forEach(function(id){
    var p = prod(id);
    if(!p || !p.available || !(cart[id] > 0)){ delete cart[id]; changed = true; }
  });
  if(changed) save();
  var out = [];
  D.products.forEach(function(p){ if(cart[p.id]) out.push({id:p.id, name:p.name, price:p.price, qty:cart[p.id], img:p.img}); });
  return out;
}
function totals(lines){
  var sub = 0; lines.forEach(function(l){ sub += l.price * l.qty; });
  var del = lines.length ? DELIVERY_FEE : 0;
  return {sub:sub, del:del, total:sub+del};
}
function cartCount(){ var n = 0; cartLines().forEach(function(l){ n += l.qty; }); return n; }

var toastTimer = null;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3600);
}

function route(){
  var h = (location.hash || '').replace(/^#/, '');
  if(!h || h === 'shop') return {n:'shop'};
  if(h.indexOf('p-') === 0) return {n:'product', id:h.slice(2)};
  if(['cart','checkout','done','track','owner'].indexOf(h) >= 0) return {n:h};
  return {n:'shop'};
}
function go(name){
  if((location.hash || '').replace(/^#/, '') === name){ render(); window.scrollTo(0,0); }
  else { location.hash = name; }
}

/* ---------- views ---------- */
function stepper(id, q){
  return '<div class="stepper" role="group" aria-label="Quantity"><button class="stp" data-act="dec" data-id="'+esc(id)+'" aria-label="Decrease quantity">−</button><span class="qty">'+q+'</span><button class="stp" data-act="inc" data-id="'+esc(id)+'" aria-label="Increase quantity">+</button></div>';
}
function buyCtl(p){
  if(!p.available) return '<span class="soldout">Sold out</span>';
  var q = cart[p.id] || 0;
  if(q > 0) return stepper(p.id, q);
  return '<button class="btn btn-primary btn-sm" data-act="add" data-id="'+esc(p.id)+'">Add to cart</button>';
}

function emailText(o){

function findOrder(q){

}

function ownerOrders(){
  var counts = {all:D.orders.length, placed:0, packed:0, shipped:0, delivered:0};
  D.orders.forEach(function(o){ counts[o.status]++; });
  var chips = [['all','All'],['placed','New'],['packed','Packed'],['shipped','Shipped'],['delivered','Delivered']].map(function(c){
    return '<button class="fchip" data-act="filter" data-id="'+c[0]+'" aria-pressed="'+(S.filter===c[0])+'">'+c[1]+' '+counts[c[0]]+'</button>';
  }).join('');
  var list = D.orders.filter(function(o){ return S.filter === 'all' || o.status === S.filter; });
  var h = '<div class="filters" role="group" aria-label="Filter orders">'+chips+'</div>';
  if(!list.length) return h + '<div class="empty"><p>No orders in this group.</p></div>';
  h += '<div class="olist">';
  list.forEach(function(o){
    var c = o.customer, nx = NEXT[o.status];
    h += '<article class="ocard"><div class="ohead"><div><strong class="oid">'+esc(o.id)+'</strong>'+(o.sample?'<span class="tag">Sample</span>':'')+'</div><span class="pill s-'+o.status+'">'+statusLabel(o.status)+'</span></div>'+
      '<div class="small muted">'+esc(c.name)+' · '+esc(c.city)+' · placed '+esc(fmtTime(o.log.placed))+'</div>'+
      '<div>'+o.items.map(function(i){ return i.qty+' × '+esc(i.name); }).join(', ')+'</div>'+
      '<div class="ofoot"><span class="price">'+inr(o.total)+' <span class="muted small" style="font-weight:400">· '+esc(o.method)+'</span></span>'+(nx?'<button class="btn btn-primary btn-sm" data-act="advance" data-id="'+esc(o.id)+'">'+nx[1]+'</button>':'<span class="muted small">Completed</span>')+'</div>'+
      '<details><summary>Delivery details</summary><p>'+esc(c.name)+'<br>'+esc(c.a1)+(c.a2?', '+esc(c.a2):'')+'<br>'+esc(c.city)+', '+esc(c.state)+' '+esc(c.pin)+'<br>Phone '+esc(c.phone)+' · '+esc(c.email)+(o.awb?'<br>Sample tracking ID '+esc(o.awb):'')+'</p></details></article>';
  });
  h += '</div>';

  h += resetBlock();
  return h;

function ownerProducts(){
  var h = '<form id="add-product-form" class="panel stack" style="margin-bottom:18px" novalidate><h2>Add a product</h2><div class="fgrid">'+
    '<div class="field span2"><label for="np-name">Name</label><input id="np-name" autocomplete="off"></div>'+
    '<div class="field span2"><label for="np-desc">One-line description</label><input id="np-desc" autocomplete="off"></div>'+
    '<div class="field"><label for="np-price">Price (₹)</label><input id="np-price" type="number" inputmode="numeric" min="1" step="1"></div></div>'+
    '<div><button class="btn btn-primary" type="submit">Add product</button></div></form>';
  h += '<div class="stack">';
  D.products.forEach(function(p){
    h += '<article class="pedit"><div class="pthumb"><div class="thumbbig">'+pic(p)+'</div><label class="btn btn-quiet btn-sm filebtn">Change photo<input class="sr" type="file" accept="image/*" data-pid="'+esc(p.id)+'" data-field="photo"></label><span class="muted small">Square photos look best.</span></div>'+
      '<div class="pfields"><div class="field"><label for="pn-'+esc(p.id)+'">Name</label><input id="pn-'+esc(p.id)+'" data-pid="'+esc(p.id)+'" data-field="name" value="'+esc(p.name)+'"></div>'+
      '<div class="field"><label for="pd-'+esc(p.id)+'">Description</label><textarea id="pd-'+esc(p.id)+'" rows="2" data-pid="'+esc(p.id)+'" data-field="desc">'+esc(p.desc)+'</textarea></div>'+
      '<div class="field" style="max-width:180px"><label for="pp-'+esc(p.id)+'">Price (₹)</label><input id="pp-'+esc(p.id)+'" type="number" inputmode="numeric" min="1" step="1" data-pid="'+esc(p.id)+'" data-field="price" value="'+p.price+'"></div>'+
      '<div class="pfoot"><label class="chk"><input type="checkbox" data-pid="'+esc(p.id)+'" data-field="available"'+(p.available?' checked':'')+'> Available to buy</label><button class="btn btn-quiet btn-sm" data-act="rm" data-id="'+esc(p.id)+'">'+(S.armRm===p.id?'Tap again to remove':'Remove')+'</button></div></div></article>';
  });
  h += '</div>';
  h += '<div class="sect"><p class="muted small">Changes save as soon as you leave a field.</p></div>';
  h += resetBlock();
  return h;
}

/* ---------- render ---------- */
function render(keepScroll){
  var y = window.scrollY, r = route(), h = '';
  switch(r.n){
    case 'shop': h = viewShop(); break;
    case 'product': h = viewProduct(r.id); break;
    case 'cart': h = viewCart(); break;
    case 'checkout': h = viewCheckout(); break;
    case 'done': h = viewDone(); break;
    case 'track': h = viewTrack(); break;
    case 'owner': h = viewOwner(); break;
  }
  $('#main').innerHTML = h;
  var cur = r.n === 'product' ? 'shop' : r.n;
  $$('[data-nav]').forEach(function(a){
    if(a.getAttribute('data-nav') === cur) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  $('#cart-count').textContent = cartCount();
  if(keepScroll) window.scrollTo(0, y);
}

/* ---------- cart actions ---------- */
function setQty(id, q){
  var p = prod(id); if(!p || !p.available) return;
  q = Math.max(0, Math.min(99, q));
  if(q === 0) delete cart[id]; else cart[id] = q;
  save(); render(true);
}

/* ---------- demo payment sheet ---------- */
var pay = null, lastFocus = null;
function drawSheet(){
  var root = $('#sheet-root');
  if(!pay){ root.innerHTML = ''; return; }
  var lines = cartLines(), t = totals(lines), body = '';
  if(pay.state === 'form'){
    var fields = S.payMethod === 'upi'
      ? '<div class="field"><label for="upi-id">UPI ID</label><input id="upi-id" value="customer@demo" readonly></div>'
      : '<div class="field"><label for="cc-num">Card number</label><input id="cc-num" value="4111 1111 1111 1111" readonly></div><div class="fgrid"><div class="field"><label for="cc-exp">Expiry</label><input id="cc-exp" value="12/30" readonly></div><div class="field"><label for="cc-cvv">CVV</label><input id="cc-cvv" value="123" readonly></div></div>';
    body = '<div class="sheet-top"><h2 id="sheet-title">Demo payment</h2><span class="tag" style="margin:0">Demo</span></div>'+
      '<div><p class="muted small">Amount to pay</p><p class="amount">'+inr(t.total)+'</p></div>'+fields+
      '<p class="muted small">Sample values only. Nothing real is collected and no money moves. In the live shop, the payment service’s own secure window opens here.</p>'+
      '<label class="chk"><input type="checkbox" id="fail-toggle"'+(pay.fail?' checked':'')+'> Show a failed payment instead</label>'+
      '<button class="btn btn-primary btn-block" data-act="pay-go" id="pay-go">Pay '+inr(t.total)+'</button>'+
      '<button class="btn btn-quiet btn-block" data-act="pay-cancel">Cancel</button>';
  } else if(pay.state === 'processing'){
    body = '<h2 id="sheet-title" class="sr">Processing payment</h2><div class="spin" aria-hidden="true"></div><p><strong>Processing payment…</strong></p><p class="muted small">Please wait. Don’t close this window.</p>';
  } else if(pay.state === 'success'){
    body = '<h2 id="sheet-title" class="sr">Payment received</h2><div class="okmark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></div><p><strong>Payment received</strong></p><p class="muted small">Creating your order…</p>';
  } else {
    body = '<h2 id="sheet-title">Payment didn’t go through</h2><p>No money was taken. You can try again.</p><button class="btn btn-primary btn-block" data-act="pay-retry" id="pay-retry">Try again</button><button class="btn btn-quiet btn-block" data-act="pay-cancel">Close</button>';
  }
  root.innerHTML = '<div class="overlay"><div class="sheet'+((pay.state==='processing'||pay.state==='success')?' center':'')+'" role="dialog" aria-modal="true" aria-labelledby="sheet-title">'+body+'</div></div>';
  var f = $('#pay-go') || $('#pay-retry'); if(f) f.focus();
}
function openPay(){ lastFocus = document.activeElement; pay = {state:'form', fail:false, timer:null}; drawSheet(); }
function closePay(){ if(pay && pay.timer) clearTimeout(pay.timer); pay = null; drawSheet(); if(lastFocus && lastFocus.focus){ try{ lastFocus.focus(); }catch(e){} } }
function startPay(){
  var tg = $('#fail-toggle'); pay.fail = !!(tg && tg.checked);
  pay.state = 'processing'; drawSheet();
  pay.timer = setTimeout(function(){
    if(!pay) return;
    if(pay.fail){ pay.state = 'failed'; drawSheet(); }
    else { pay.state = 'success'; drawSheet(); pay.timer = setTimeout(finishOrder, 900); }
  }, 1400);
}
function finishOrder(){
  var lines = cartLines();
  pay = null; drawSheet();
  if(!lines.length){ go('shop'); return; }
  var t = totals(lines), f = S.form, num = D.nextOrder++;
  var o = {id:'AB-'+num, sample:false,
    customer:{name:f.name.trim(), phone:normPhone(f.phone), email:f.email.trim(), a1:f.a1.trim(), a2:f.a2.trim(), city:f.city.trim(), state:f.state, pin:f.pin.trim()},
    items:lines.map(function(l){ return {id:l.id, name:l.name, price:l.price, qty:l.qty}; }),
    subtotal:t.sub, delivery:t.del, total:t.total, method:S.payMethod === 'upi' ? 'UPI' : 'Card', status:'placed', log:{placed:Date.now()}, awb:null};
  D.orders.unshift(o); cart = {}; save();
  S.lastOrderId = o.id; S.form = blankForm(); S.errors = {};
  go('done');
}

/* ---------- checkout validation ---------- */
function normPhone(s){
  s = String(s || '').replace(/[\s-]/g, '');
  if(/^\+91\d{10}$/.test(s)) return s.slice(3);
  if(/^91\d{10}$/.test(s)) return s.slice(2);
  if(/^0\d{10}$/.test(s)) return s.slice(1);
  return s;
}
function validate(){
  var f = S.form, e = {};
  if(!f.name.trim()) e.name = 'Enter your full name.';
  if(!/^[6-9]\d{9}$/.test(normPhone(f.phone))) e.phone = 'Enter a 10-digit mobile number.';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) e.email = 'Enter a valid email address.';
  if(!f.a1.trim()) e.a1 = 'Enter your address.';
  if(!f.city.trim()) e.city = 'Enter your city.';
  if(!f.state) e.state = 'Select your state.';
  if(!/^[1-9]\d{5}$/.test(f.pin.trim())) e.pin = 'Enter a 6-digit pincode.';
  return e;
}

/* ---------- owner actions ---------- */
function advance(id){
  var o = findOrder(id); if(!o || !NEXT[o.status]) return;
  var nx = NEXT[o.status][0];
  o.status = nx; o.log[nx] = Date.now();
  if(nx === 'shipped') o.awb = 'DEMO' + (900000000 + parseInt(o.id.slice(3), 10) * 137);
  save(); render(true);
  if(nx === 'packed') toast('Order '+o.id+' marked as packed.');
  if(nx === 'shipped') toast('Sample shipment created. A shipped email would go to '+o.customer.email+' (preview only).');
  if(nx === 'delivered') toast('Order '+o.id+' marked as delivered.');
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'product'; }
function handlePhoto(p, file){
  if(!file || !/^image\//.test(file.type)){ toast('Choose an image file.'); return; }
  var fr = new FileReader();
  fr.onload = function(){
    var im = new Image();
    im.onload = function(){
      var max = 640, s = Math.min(1, max / Math.max(im.width, im.height));
      var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width*s)); c.height = Math.max(1, Math.round(im.height*s));
      var url; try{ c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); url = c.toDataURL('image/jpeg', 0.82); }catch(e){ toast('That image could not be used.'); return; }
      p.img = url;
      var ok = save();
      $$('img[data-thumb="'+p.id+'"]').forEach(function(el){ el.src = url; });
      toast(ok ? 'Photo updated.' : 'Photo updated for this visit only. Browser storage is full or blocked.');
    };
    im.onerror = function(){ toast('That image could not be read.'); };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
  if(act === 'add') setQty(id, (cart[id] || 0) + 1);
  else if(act === 'inc') setQty(id, (cart[id] || 0) + 1);
  else if(act === 'dec') setQty(id, (cart[id] || 0) - 1);
  else if(act === 'remove') setQty(id, 0);
  else if(act === 'pay-go') startPay();
  else if(act === 'pay-cancel') closePay();
  else if(act === 'pay-retry'){ pay.state = 'form'; pay.fail = false; drawSheet(); }
  else if(act === 'track-order'){ S.trackQ = id; go('track'); }
  else if(act === 'track-sample'){ S.trackQ = 'AB-1001'; render(); }
  else if(act === 'tab'){ S.tab = id; S.armReset = false; S.armRm = null; render(); }
  else if(act === 'filter'){ S.filter = id; render(); }
  else if(act === 'advance') advance(id);
  else if(act === 'rm'){
    if(S.armRm === id){
      var p = prod(id); D.products = D.products.filter(function(x){ return x.id !== id; }); delete cart[id]; S.armRm = null; save(); render(true);
      toast((p ? p.name : 'Product') + ' removed.');
    } else { S.armRm = id; render(true); }
  }
  else if(act === 'reset'){
    if(S.armReset){
      try{ localStorage.removeItem(KEY); }catch(err){}
      D = seedData(); cart = {}; S.armReset = false; S.lastOrderId = null; S.trackQ = ''; S.form = blankForm(); S.errors = {}; S.filter = 'all';
      render(true); toast('Demo data reset.');
    } else { S.armReset = true; render(true); }
  }
});

document.addEventListener('input', function(e){
  var t = e.target, k = t.getAttribute && t.getAttribute('data-f');
  if(k){ S.form[k] = t.value; if(S.errors[k]){ delete S.errors[k]; var box = t.closest('.field'); if(box){ box.classList.remove('err'); var m = box.querySelector('.msg-err'); if(m) m.remove(); t.removeAttribute('aria-invalid'); } } }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(t.name === 'pm'){ S.payMethod = t.value; return; }
  if(t.id === 'f-state'){ S.form.state = t.value; return; }
  var pid = t.getAttribute && t.getAttribute('data-pid'); if(!pid) return;
  var p = prod(pid); if(!p) return;
  var field = t.getAttribute('data-field');
  if(field === 'photo'){ handlePhoto(p, t.files && t.files[0]); t.value = ''; return; }
  if(field === 'name'){ var nm = t.value.trim(); if(!nm){ toast('A product needs a name.'); t.value = p.name; return; } p.name = nm; }
  else if(field === 'desc'){ p.desc = t.value.trim(); }
  else if(field === 'price'){ var v = Math.round(Number(t.value)); if(!(v > 0) || v > 1000000){ toast('Enter a price above zero.'); t.value = p.price; return; } p.price = v; }
  else if(field === 'available'){ p.available = !!t.checked; }
  save(); $('#cart-count').textContent = cartCount(); toast('Saved.');
});

document.addEventListener('submit', function(e){
  var f = e.target; e.preventDefault();
  if(f.id === 'checkout-form'){
    S.errors = validate();
    var keys = Object.keys(S.errors);
    if(keys.length){ render(true); var first = $('#f-' + ['name','phone','email','a1','city','state','pin'].filter(function(k){ return S.errors[k]; })[0]); if(first) first.focus(); return; }
    openPay();
  } else if(f.id === 'track-form'){
    S.trackQ = ($('#track-q').value || '').trim(); render(true);
  } else if(f.id === 'add-product-form'){
    var name = $('#np-name').value.trim(), desc = $('#np-desc').value.trim(), price = Math.round(Number($('#np-price').value));
    if(!name){ toast('Enter a product name.'); $('#np-name').focus(); return; }
    if(!(price > 0)){ toast('Enter a price above zero.'); $('#np-price').focus(); return; }
    var base = slug(name), id = base, n = 2;
    while(prod(id)){ id = base + '-' + n++; }
    D.products.push({id:id, name:name, desc:desc || 'A new product.', price:price, img:'art:generic', available:true});
    save(); render(true); toast(name + ' added. It now shows in the shop.');
  }
});

document.addEventListener('keydown', function(e){
  if(!pay) return;
  if(e.key === 'Escape' && (pay.state === 'form' || pay.state === 'failed')){ closePay(); return; }
  if(e.key === 'Tab'){
    var sheet = $('.sheet'); if(!sheet) return;
    var f = $$('button, input:not([readonly]), a[href]', sheet).filter(function(el){ return !el.disabled; });
    if(!f.length){ e.preventDefault(); return; }
    var first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    else if(!sheet.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
  }
});

window.addEventListener('hashchange', function(){ S.armReset = false; S.armRm = null; render(); window.scrollTo(0, 0); });

(function(){
  var v = document.querySelector('meta[name="app-version"]'), d = document.querySelector('meta[name="app-build-date"]'), el = document.getElementById('build-label');
  if(el) el.textContent = 'Demo build v' + (v ? v.content : '?') + (d ? ' · ' + d.content : '');
})();
load();
render();
})();
</script>
